version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: health_assistant_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword123
      POSTGRES_DB: health_assistant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: health_assistant_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://neondb_owner:npg_15obMgHtcFmE@ep-late-recipe-apz7awt5.c-7.us-east-1.aws.neon.tech/neondb?sslmode=require
      - SECRET_KEY=PRODUCTION_SECURE_JWT_SECRET_KEY_SELECTION_HERE_987654321
      - OPENAI_API_KEY=your_openai_api_key_here
      - LLM_MODEL=gpt-4o-mini
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: health_assistant_frontend
    restart: always
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
